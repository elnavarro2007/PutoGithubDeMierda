<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>
    function esAbundante(n) {
     if (n <= 1) return false;

     let suma = 1;
     for (let i = 2; i * i <= n; i++) {
       if (n % i === 0) {
         suma += i;
         if (i !== n / i && n / i !== n) {
           suma += n / i;
         }
       }
     }
     return suma > n;
    }

    // Ejemplo
    console.log(esAbundante(12)); // true
    console.log(esAbundante(18)); // true
    console.log(esAbundante(10)); // false
</script>

</body>
</html>
