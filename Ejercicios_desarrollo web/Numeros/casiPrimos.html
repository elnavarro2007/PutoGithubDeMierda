<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        function esCasiPrimo(n) {
          if (n < 4) return false;
        
          // Comprueba si es p²
          const raiz = Math.sqrt(n);
          if (Number.isInteger(raiz) && esPrimo(raiz)) return true;
        
          // Comprueba si es p × q
          for (let i = 2; i <= Math.sqrt(n); i++) {
            if (n % i === 0) {
              const otro = n / i;
              if (esPrimo(i) && esPrimo(otro)) return true;
            }
          }
          return false;
        }

        // Necesita la función esPrimo de arriba
        function esPrimo(n) {
          if (n <= 1) return false;
          if (n <= 3) return true;
          if (n % 2 === 0 || n % 3 === 0) return false;
          for (let i = 5; i * i <= n; i += 6) {
            if (n % i === 0 || n % (i + 2) === 0) return false;
          }
          return true;
        }

        // Ejemplo
        console.log(esCasiPrimo(9));  // true (3×3)
        console.log(esCasiPrimo(15)); // true (3×5)
        console.log(esCasiPrimo(8));  // false
    </script>
</body>
</html>
