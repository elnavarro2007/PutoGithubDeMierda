</head>

<body>

    <table>
        <script>

            document.write("<tr>")



            for (let i = 0; i <= 10; i++) {
                document.write("tabla del : " + i + " || ");
            }
            
            document.write("</tr>")
            
            
            for (let i = 0; i < 11; i++) {
                document.write("<tr>");

                for (let j = 0; j < 11; j++) {
                   document.write("<td>"+ " || " + i + " * " + j + " = " + (i * j) + "</td>");
                }
                document.write("</tr>");
            }

            



        </script>
    </table>
