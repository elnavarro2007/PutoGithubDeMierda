<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    table {
        border: 1px solid;
        padding: 10px;
    }


    .casi-primo {
            background-color: yellow;
    }

</style>
<body>
    
    <button id="btnCalcular">Calcular casi primos</button>
    <table id= "tabla" border= "1px">
        <tbody id="cuerpo">

        </tbody>

    </table>


    <script>
        var  num = 0
        
        var cuerpo = document.getElementById("cuerpo")
        for (let i = 0; i < 100; i++) {
            var fila = document.createElement("tr")
            tabla.appendChild(fila)
            for(let j = 0; j<100; j++){
                var celda = document.createElement("td")
                num++
                celda.textContent = num
                fila.appendChild(celda)
            }
            cuerpo.appendChild(fila)
        }

        function esCasiPrimo(n) {
            if (n < 4) return false;

            let contador = 0;

            for (let i = 1; i <= n; i++) {
                if (n % i === 0) {
                    contador++;
                    if (contador > 3) return false;
                }
            }

            return contador === 3;
        }



        document.getElementById("btnCalcular").addEventListener("click", function () {
            const celdas = document.querySelectorAll("#cuerpo td");

            celdas.forEach(celda => {
                const numero = parseInt(celda.textContent);

                if (esCasiPrimo(numero)) {
                    celda.classList.add("casi-primo");
                }
            });
        });


    </script>
</body>
</html>
