<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Presiona una tecla para que aparezcan cuantos dnis de 4 cifras con esa letra existen</p>
    <div id="res"> respuesta</div>




    <script>
        const letras = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
        var res = document.getElementById("res")

        document.addEventListener("keydown", function(event) {
            let letra = event.key.toUpperCase();

            // Solo procesamos si es una letra de la A a la Z
            if (letra < "A" || letra > "Z") {
                return;
            }

            let lista = "";
            let contador = 0;

            for (let i = 1; i <= 9999; i++) {
                let letraDNI = letras[i % 23];

                if (letraDNI === letra) {
                    

                    contador++;
                }
            }

            res.innerHTML = "Letra: " + letra + 
                                  "<br>Total de DNIs: " + contador + 
                                  "<br><br>" + lista;
        });
    </script>
</body>
</html>
