<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <div id="posicion">X: 0  Y: 0</div>
    <p>Mostrar la posicion del raton</p>
    <script>
        var posicion = document.getElementById("posicion")

        var funcionPos = function(event) {

            const x = event.clientX;  
            const y = event.clientY;  
            
            posicion.innerHTML = `X : ${x} , Y : ${y}`
        }

        document.addEventListener("mousemove",funcionPos)


        
        
    </script>
</body>
</html>
