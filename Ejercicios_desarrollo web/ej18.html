<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var valor = prompt("Introduce lo que sea")

        for (let index = 1; index < valor; index += 2 ) {
            document.write(index)

            document.write("<br>")
            
        }
    </script>
</body>
</html>
