<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var anio = prompt("Introduce un año, se dira si es bisiesto")

        var parseAnio = parseInt(anio)
        if(parseAnio % 4 === 0 && (anio % 100 !== 0 || anio % 400 === 0)){
            document.write(parseAnio + " es bisiesto")
        }else{
            document.write("No es bisiesto")
        }

    </script>
</body>
</html>
