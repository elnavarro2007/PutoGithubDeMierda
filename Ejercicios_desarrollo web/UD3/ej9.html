<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let frase = prompt("Introduce una frase")
        let fraseMm = frase.split(" ")
        let f = " "
        var regex = new RegExp(["a-zñ"])

        for (let i = 0; i < fraseMm.length; i++) {
            let s = fraseMm[i];

            if (s.length > 0) {
                fraseMm[i] = s.charAt(0).toUpperCase() + s.slice(1);
            }
            f = f+ " " +fraseMm[i]
        }
        document.write(f)
        


    </script>
</body>
</html>
