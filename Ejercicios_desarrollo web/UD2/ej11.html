<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        let verdadero = true;
        let num;

        while(verdadero){
            let cartel = prompt("introduce un numero")
            
            num = cartel

            if (!isNaN(num)){
                verdadero = false
            }


        }

        document.write(num.length)

        
    </script>
</body>
</html>
