<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero = prompt("Introduce un numero, se va a calcular el factorial")

        var fact = 1
       

            

        for( var i = 1 ; i <= numero ; i++){
            fact *= i
        }
        document.write("el factorial de ",numero ," es : ",fact)
        
    </script>


</body>
</html>
