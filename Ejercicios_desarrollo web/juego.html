<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini RPG - Combate de Turnos</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #pantalla-juego {
            width: 500px;
            background-color: #222;
            border: 4px solid #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .zona-combate {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 2px dashed #444;
            padding-bottom: 20px;
        }
        .stats {
            background-color: #333;
            padding: 10px;
            border-radius: 4px;
            width: 45%;
        }
        .stats h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #ffcc00; }
        .barra {
            background-color: #555;
            height: 15px;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }
        .vida { background-color: #ff4d4d; height: 100%; transition: width 0.3s; }
        .mana { background-color: #3399ff; height: 100%; transition: width 0.3s; }
        #registro-combate {
            height: 100px;
            background-color: #000;
            border: 2px solid #444;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #00ff00;
        }
        .controles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            background-color: #444;
            color: white;
            border: 2px solid #fff;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background-color: #666; }
        button:disabled { background-color: #222; color: #555; border-color: #444; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="pantalla-juego">
    <!-- Zona Visual de Stats estilo RPG Maker -->
    <div class="zona-combate">
        <div class="stats">
            <h2>Héroe (Tú)</h2>
            <div>HP: <span id="heroe-hp-texto">100/100</span></div>
            <div class="barra"><div id="heroe-hp-barra" class="vida" style="width: 100%;"></div></div>
            <div style="margin-top: 10px;">MP: <span id="heroe-mp-texto">30/30</span></div>
            <div class="barra"><div id="heroe-mp-barra" class="mana" style="width: 100%;"></div></div>
        </div>
        
        <div class="stats" style="text-align: right;">
            <h2 style="color: #ff4d4d;">Rey Demonio</h2>
            <div>HP: <span id="rival-hp-texto">150/150</span></div>
            <div class="barra"><div id="rival-hp-barra" class="vida" style="width: 100%;"></div></div>
            <div style="margin-top: 10px; color: #aaa;">Estado: Normal</div>
        </div>
    </div>

    <!-- Registro de Texto del Combate -->
    <div id="registro-combate">¡Un Rey Demonio salvaje ha aparecido! ¡Prepárate para la batalla!</div>

    <!-- Panel de Comandos de RPG Maker -->
    <div class="controles">
        <button onclick="accionHeroe('atacar')">⚔️ Atacar</button>
        <button id="btn-magia" onclick="accionHeroe('magia')">✨ Fuego (10 MP)</button>
        <button id="btn-curar" onclick="accionHeroe('curar')">🧪 Poción (5 MP)</button>
        <button onclick="accionHeroe('huir')">🏃 Huir</button>
    </div>
</div>

<script>
    // Variables de estado de los personajes
    const heroe = { hp: 100, maxHp: 100, mp: 30, maxMp: 30, atk: 15 };
    const rival = { nombre: "Rey Demonio", hp: 150, maxHp: 150, atk: 18 };
    
    let turnoBloqueado = false;
    const registro = document.getElementById("registro-combate");

    function escribirRegistro(texto) {
        registro.innerHTML += `<br>${texto}`;
        registro.scrollTop = registro.scrollHeight;
    }

    function actualizarInterfaz() {
        // Héroe
        document.getElementById("heroe-hp-texto").innerText = `${heroe.hp}/${heroe.maxHp}`;
        document.getElementById("heroe-hp-barra").style.width = `${(heroe.hp / heroe.maxHp) * 100}%`;
        document.getElementById("heroe-mp-texto").innerText = `${heroe.mp}/${heroe.maxMp}`;
        document.getElementById("heroe-mp-barra").style.width = `${(heroe.mp / heroe.maxMp) * 100}%`;
        
        // Rival
        document.getElementById("rival-hp-texto").innerText = `${rival.hp}/${rival.maxHp}`;
        document.getElementById("rival-hp-barra").style.width = `${(rival.hp / rival.maxHp) * 100}%`;

        // Desactivar botones si no hay maná
        document.getElementById("btn-magia").disabled = heroe.mp < 10;
        document.getElementById("btn-curar").disabled = heroe.mp < 5;
    }

    function desactivarBotones(estado) {
        const botones = document.querySelectorAll(".controles button");
        botones.forEach(btn => btn.disabled = estado);
    }

    // Turno del Jugador
    function accionHeroe(tipo) {
        if (turnoBloqueado) return;
        turnoBloqueado = true;
        desactivarBotones(true);

        if (tipo === 'atacar') {
            let dmg = Math.floor(heroe.atk * (0.9 + Math.random() * 0.2)); // Variación de daño típica RPG
            rival.hp = Math.max(0, rival.hp - dmg);
            escribirRegistro(`⚔️ ¡Atacas al enemigo y le infliges **${dmg}** de daño!`);
        } 
        else if (tipo === 'magia') {
            heroe.mp -= 10;
            let dmg = Math.floor(35 * (0.9 + Math.random() * 0.2)); // Hechizo poderoso
            rival.hp = Math.max(0, rival.hp - dmg);
            escribirRegistro(`✨ ¡Lanzas Fuego! El enemigo sufre **${dmg}** de daño mágico.`);
        } 
        else if (tipo === 'curar') {
            heroe.mp -= 5;
            let cura = 40;
            heroe.hp = Math.min(heroe.maxHp, heroe.hp + cura);
            escribirRegistro(`🧪 ¡Usas una Poción! Recuperas **${cura}** HP.`);
        } 
        else if (tipo === 'huir') {
            escribirRegistro("🏃 ¡Intentas huir de la batalla!...");
            setTimeout(() => {
                if (Math.random() > 0.5) {
                    escribirRegistro("💨 ¡Escapaste con éxito!");
                    return;
                } else {
                    escribirRegistro("❌ ¡No pudiste escapar!");
                    turnoRival();
                }
            }, 1000);
            actualizarInterfaz();
            return;
        }

        actualizarInterfaz();

        // Comprobar si el rival ha muerto
        if (rival.hp <= 0) {
            setTimeout(() => {
                escribirRegistro("🎉 ¡Victoria! Has derrotado al Rey Demonio. ¡El mundo está a salvo!");
            }, 1000);
            return;
        }

        // Si sobrevive, va el turno del enemigo
        setTimeout(turnoRival, 1200);
    }

    // Turno de la IA (Enemigo)
    function turnoRival() {
        // El enemigo decide atacar o lanzar un golpe fuerte aleatoriamente
        let esCritico = Math.random() > 0.7;
        let dmgBase = esCritico ? rival.atk * 1.5 : rival.atk;
        let dmg = Math.floor(dmgBase * (0.9 + Math.random() * 0.2));

        heroe.hp = Math.max(0, heroe.hp - dmg);
        
        if (esCritico) {
            escribirRegistro(`💥 ¡Golpe Crítico! El Rey Demonio te embiste brutalmente provocando **${dmg}** de daño.`);
        } else {
            escribirRegistro(`👿 El Rey Demonio ataca. Recibes **${dmg}** de daño.`);
        }

        actualizarInterfaz();

        // Comprobar si el héroe ha muerto
        if (heroe.hp <= 0) {
            setTimeout(() => {
                escribirRegistro("💀 Has caído en combate... GAME OVER.");
            }, 1000);
            return;
        }

        // Devolver control al jugador
        setTimeout(() => {
            turnoBloqueado = false;
            desactivarBotones(false);
            actualizarInterfaz(); // Reestablece estados de botones por maná
        }, 1000);
    }
</script>

</body>
</html>
