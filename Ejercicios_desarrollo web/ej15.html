<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var lista = [];

        for (var i = 0; i<4;i++){
            var palabra = prompt("Introduce 4 palabras, te quedan "+(4-i))
            lista.push(palabra)
            
        }
        lista.sort()
        document.write(lista)
    </script>
</body>
</html>
